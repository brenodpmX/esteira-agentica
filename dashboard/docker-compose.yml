# Dashboard de telemetria das esteiras (Collector OTLP → ClickHouse → Grafana).
# Subir:  cp .env.example .env  (preencher senhas)  &&  docker compose up -d
# Exemplo: docker compose --profile exemplo up -d   (gera dados de duas pipes fictícias)

name: esteira-dashboard

x-ch-env: &ch-env
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?defina CLICKHOUSE_USER no .env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?defina CLICKHOUSE_PASSWORD no .env}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.37.5-alpine
    environment:
      <<: *ch-env
      CLICKHOUSE_DB: esteira
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [interna]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      <<: *ch-env
      RETENCAO_HORAS: ${RETENCAO_HORAS:-720}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      clickhouse: { condition: service_healthy }
    networks:
      interna: {}
      telemetria:
        aliases: [esteira-otlp]
    restart: unless-stopped

  # Aplica as views SQL e mantém a tabela de configuração em dia com o dashboard.yml.
  config-sync:
    build: ./tools
    command: ["config_sync.py"]
    environment:
      <<: *ch-env
      CLICKHOUSE_URL: http://clickhouse:8123
      CONFIG_SYNC_INTERVALO: ${CONFIG_SYNC_INTERVALO:-30}
    volumes:
      - ./dashboard.yml:/config/dashboard.yml:ro
      - ./sql:/sql:ro
    depends_on:
      clickhouse: { condition: service_healthy }
    networks: [interna]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      <<: *ch-env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5,volkovlabs-echarts-panel@7.3.0
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/esteira.json
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Sao_Paulo
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      clickhouse: { condition: service_healthy }
    networks: [interna]
    restart: unless-stopped

  # Gerador de dados de exemplo (duas pipes fictícias). Só com --profile exemplo.
  gerador:
    profiles: [exemplo]
    build: ./tools
    command: ["gerador.py"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://esteira-otlp:4318
      GERADOR_PIPES: ${GERADOR_PIPES:-2}
      GERADOR_HISTORICO_DIAS: ${GERADOR_HISTORICO_DIAS:-7}
      GERADOR_INTERVALO: ${GERADOR_INTERVALO:-6}
    volumes:
      - gerador-estado:/dados
    depends_on: [otel-collector]
    networks: [telemetria]
    restart: unless-stopped

networks:
  interna: {}
  telemetria:
    name: esteira-telemetria

volumes:
  clickhouse-data:
  grafana-data:
  gerador-estado:
