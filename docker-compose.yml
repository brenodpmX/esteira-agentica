# Requer Docker Compose V2 (docker compose, sem hífen)
# Valor central: trocar pipe.yml, contexts/ ou credenciais NÃO exige 'docker build'

services:
  # Daemon Docker isolado (Docker-in-Docker) para o agente subir as stacks
  # dev/qa do produto e rodar ITs Testcontainers. Fica num sidecar privileged;
  # o daemon e os containers aninhados NÃO tocam o host (raio de dano contido).
  # Os dados do daemon (imagens, volumes das stacks) persistem em dind-storage,
  # dando um ambiente de desenvolvimento/teste "de verdade" entre execuções.
  # NOTA DE SEGURANÇA: privileged é requisito do dind; por isso o daemon é
  # isolado aqui em vez de expor o socket do host ao agente.
  dind:
    image: ${DIND_IMAGE:-docker:27.3.1-dind}
    privileged: true
    # Não anexa os logs do daemon dind à saída agregada do 'docker compose up'
    # (o 'make' roda em foreground): o log do dind poluía o log da esteira. O
    # serviço continua rodando normalmente e seus logs seguem acessíveis via
    # 'docker compose logs dind'. Requer Compose v2.20+.
    attach: false
    environment:
      # TLS desligado: o entrypoint do docker:dind passa a publicar o daemon em
      # tcp://0.0.0.0:2375 (além do socket unix) dentro DESTE network namespace,
      # que só o serviço pipe compartilha — não é publicado no host. O pipe
      # conecta por tcp://127.0.0.1:2375.
      - DOCKER_TLS_CERTDIR=
    volumes:
      # /var/lib/docker: imagens + volumes das stacks aninhadas (dev/qa).
      - dind-storage:/var/lib/docker
      # Repo compartilhado NO MESMO PATH que o pipe: bind mounts das stacks do
      # produto (ex.: dev/lib) são resolvidos pelo daemon no filesystem do dind,
      # então precisam existir aqui com o mesmo caminho absoluto.
      - pipe-repo:/app/repo
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  pipe:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Caminho INTERNO da chave SSH (determinado pelo compose, não pelo operador)
      - PIPE_SSH_KEY_FILE=/run/secrets/ssh_key
      # Fuso horário do container (default: host ou America/Sao_Paulo)
      - TZ=${TZ:-America/Sao_Paulo}
      # Fala com o daemon do sidecar dind (netns compartilhado abaixo)
      - DOCKER_HOST=tcp://127.0.0.1:2375
    # Compartilha o network namespace do dind: assim as portas publicadas pelas
    # stacks aninhadas (api:8080, web:3000, etc.) ficam em localhost para o
    # agente, e os seeds/validações do dev.sh que batem em http://localhost:PORT
    # funcionam sem alterar os scripts do produto.
    network_mode: "service:dind"
    depends_on:
      dind:
        condition: service_healthy
    volumes:
      # Configuração: editar no host + 'docker compose up -d' = nova config SEM rebuild
      - ./pipe.yml:/app/pipe.yml:ro
      - ./contexts:/app/contexts:ro
      # Estado de runtime (persistência validada em US-04 / issue #19)
      - pipe-repo:/app/repo
      - pipe-logs:/app/logs
      - pipe-state:/app/.pipe
      - kiro-home:/home/pipe/.kiro
      - kiro-local:/home/pipe/.local/share/kiro-cli
    secrets:
      - ssh_key
    # PID 1 = tini: repassa SIGTERM ao Python (shutdown limpo/rápido, sem
    # escalar para SIGKILL/137) e reapa processos zumbis (issue #70)
    init: true
    # Reinicia após crash ou reboot do host; para com docker compose stop (US-05)
    restart: unless-stopped

secrets:
  ssh_key:
    file: ${SSH_KEY_FILE_HOST}   # caminho NO HOST, fornecido via .env

volumes:
  pipe-repo:
  pipe-logs:
  pipe-state:
  kiro-home:
  kiro-local:
  # Storage do daemon dind: persiste imagens e volumes das stacks dev/qa entre
  # execuções (ambiente de desenvolvimento/teste "real"). qa/run.sh faz seu
  # próprio down -v a cada rodada; os dados do modo dev persistem aqui.
  dind-storage:
