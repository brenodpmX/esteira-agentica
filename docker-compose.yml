# Requer Docker Compose V2 (docker compose, sem hífen)
# Valor central: trocar pipe.yml, contexts/ ou credenciais NÃO exige 'docker build'

services:
  # Init de permissões: ajusta a posse dos pontos de montagem de estado para o
  # usuário pipe (uid 1000) ANTES do serviço pipe subir, e encerra. Necessário
  # porque, com bind mounts (compose.dev.yml), se o diretório do host não existe
  # no 'up', o daemon Docker cria o mountpoint como root e o pipe (não-root,
  # ADR-05) falha com PermissionError ao abrir .pipe/pipe.lock. Rodar este passo
  # como root torna a subida idempotente a 'rm -rf .pipe'/pod morto, sem tornar
  # o serviço pipe root (ADR-05 preservado: só este init efêmero usa root).
  # Com named volumes (base), é inócuo: o chown apenas reafirma pipe:pipe.
  init-perms:
    build:
      context: .
    user: "0:0"
    command:
      - sh
      - -c
      - >
        for d in /app/.pipe /app/logs /app/repo
        /home/pipe/.kiro /home/pipe/.local/share/kiro-cli; do
        mkdir -p "$$d" && chown pipe:pipe "$$d"; done
    volumes:
      - pipe-repo:/app/repo
      - pipe-logs:/app/logs
      - pipe-state:/app/.pipe
      - kiro-home:/home/pipe/.kiro
      - kiro-local:/home/pipe/.local/share/kiro-cli
    # Sem 'restart': é um passo único que executa e encerra (default = no).
    # Se o chown falhar (saída != 0), o pipe nem sobe (depends_on exige sucesso).

  # Daemon Docker isolado (Docker-in-Docker) para o agente subir as stacks
  # dev/qa do produto e rodar ITs Testcontainers. Fica num sidecar privileged;
  # o daemon e os containers aninhados NÃO tocam o host (raio de dano contido).
  # Os dados do daemon (imagens, volumes das stacks) persistem em dind-storage,
  # dando um ambiente de desenvolvimento/teste "de verdade" entre execuções.
  # NOTA DE SEGURANÇA: privileged é requisito do dind; por isso o daemon é
  # isolado aqui em vez de expor o socket do host ao agente.
  dind:
    image: ${DIND_IMAGE:-docker:27.3.1-dind}
    privileged: true
    # Não anexa os logs do daemon dind à saída agregada do 'docker compose up'
    # (o 'make' roda em foreground): o log do dind poluía o log da esteira. O
    # serviço continua rodando normalmente e seus logs seguem acessíveis via
    # 'docker compose logs dind'. Requer Compose v2.20+.
    attach: false
    environment:
      # TLS desligado: o entrypoint do docker:dind passa a publicar o daemon em
      # tcp://0.0.0.0:2375 (além do socket unix) dentro DESTE network namespace,
      # que só o serviço pipe compartilha — não é publicado no host. O pipe
      # conecta por tcp://127.0.0.1:2375.
      - DOCKER_TLS_CERTDIR=
    volumes:
      # /var/lib/docker: imagens + volumes das stacks aninhadas (dev/qa).
      - dind-storage:/var/lib/docker
      # Repo compartilhado NO MESMO PATH que o pipe: bind mounts das stacks do
      # produto (ex.: dev/lib) são resolvidos pelo daemon no filesystem do dind,
      # então precisam existir aqui com o mesmo caminho absoluto.
      - pipe-repo:/app/repo
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Ponte de socket: expõe um socket Docker Unix em /var/run/docker.sock
  # encaminhando para o daemon do dind em tcp://127.0.0.1:2375. O container pipe
  # compartilha o NETWORK namespace do dind (alcança o tcp) mas NÃO o filesystem,
  # então não enxerga o socket unix do dind. Ferramentas que assumem o socket
  # unix padrão (Testcontainers, docker CLI sem DOCKER_HOST) passam a funcionar
  # dentro do pipe sem alterar o produto. Reusa a imagem do pipe (tem socat) e
  # roda como root só para criar o socket no volume compartilhado. O socket vai
  # num named volume (docker-sock) montado em /var/run no bridge e no pipe.
  sockbridge:
    build:
      context: .
    user: "0:0"
    # Não anexa os logs do socat à saída agregada do 'docker compose up': cada
    # conexão Docker encerrada no teardown (Testcontainers/Ryuk) emite uma linha
    # 'write(...): Broken pipe' benigna que poluía o log da esteira. O serviço
    # segue rodando e seus logs continuam acessíveis via
    # 'docker compose logs sockbridge'. Requer Compose v2.20+.
    attach: false
    network_mode: "service:dind"
    depends_on:
      dind:
        condition: service_healthy
    command:
      # unlink-early: remove um socket pré-existente antes do bind. O volume
      # docker-sock é persistente; se a instância anterior morreu (SIGKILL) sem
      # limpar, o socket velho fica no volume e o socat aborta ("exists") em loop
      # de restart. unlink-early torna cada subida idempotente.
      - socat
      - UNIX-LISTEN:/var/run/docker.sock,fork,mode=0666,unlink-early
      - TCP:127.0.0.1:2375
    volumes:
      - docker-sock:/var/run
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/docker.sock"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pipe:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Caminho INTERNO da chave SSH (determinado pelo compose, não pelo operador)
      - PIPE_SSH_KEY_FILE=/run/secrets/ssh_key
      # Fuso horário do container (default: host ou America/Sao_Paulo)
      - TZ=${TZ:-America/Sao_Paulo}
      # Fala com o daemon do sidecar dind (netns compartilhado abaixo)
      - DOCKER_HOST=tcp://127.0.0.1:2375
    # Compartilha o network namespace do dind: assim as portas publicadas pelas
    # stacks aninhadas (api:8080, web:3000, etc.) ficam em localhost para o
    # agente, e os seeds/validações do dev.sh que batem em http://localhost:PORT
    # funcionam sem alterar os scripts do produto.
    network_mode: "service:dind"
    depends_on:
      dind:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
      sockbridge:
        condition: service_healthy
    volumes:
      # Configuração: editar no host + 'docker compose up -d' = nova config SEM rebuild
      - ./pipe.yml:/app/pipe.yml:ro
      - ./contexts:/app/contexts:ro
      # Estado de runtime (persistência validada em US-04 / issue #19)
      - pipe-repo:/app/repo
      - pipe-logs:/app/logs
      - pipe-state:/app/.pipe
      - kiro-home:/home/pipe/.kiro
      - kiro-local:/home/pipe/.local/share/kiro-cli
      # Socket Docker Unix fornecido pelo sockbridge (-> daemon do dind via tcp),
      # para ferramentas que assumem /var/run/docker.sock (ex.: Testcontainers).
      - docker-sock:/var/run
    secrets:
      - ssh_key
    # PID 1 = tini: repassa SIGTERM ao Python (shutdown limpo/rápido, sem
    # escalar para SIGKILL/137) e reapa processos zumbis (issue #70)
    init: true
    # Reinicia após crash ou reboot do host; para com docker compose stop (US-05)
    restart: unless-stopped

secrets:
  ssh_key:
    file: ${SSH_KEY_FILE_HOST}   # caminho NO HOST, fornecido via .env

volumes:
  pipe-repo:
  pipe-logs:
  pipe-state:
  kiro-home:
  kiro-local:
  # Socket Docker Unix compartilhado entre sockbridge (cria) e pipe (consome).
  docker-sock:
  # Storage do daemon dind: persiste imagens e volumes das stacks dev/qa entre
  # execuções (ambiente de desenvolvimento/teste "real"). qa/run.sh faz seu
  # próprio down -v a cada rodada; os dados do modo dev persistem aqui.
  dind-storage:
